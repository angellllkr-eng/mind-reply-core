name: Frontier Modern

on:
  push:
    branches: [main, 'frontier/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-modern-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate application
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile && pnpm run build --if-present && pnpm test --if-present;
          elif [ -f yarn.lock ]; then corepack enable && yarn install --immutable && yarn build --if-present && yarn test --if-present;
          elif [ -f package-lock.json ]; then npm ci && npm run build --if-present && npm test --if-present;
          elif [ -f package.json ]; then npm install && npm run build --if-present && npm test --if-present;
          else echo 'No Node package detected; repository validation complete.'; fi
