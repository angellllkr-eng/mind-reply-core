name: Reality Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  reality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify declared public routes
        env:
          BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          REALITY_ROUTES: ${{ vars.REALITY_ROUTES }}
          EXPECTED_RELEASE_SHA: ${{ vars.EXPECTED_RELEASE_SHA }}
          RELEASE_SHA_URL: ${{ vars.RELEASE_SHA_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "PUBLIC_BASE_URL is not configured; no production claim is made."
            exit 0
          fi
          bash scripts/reality-gate.sh
