name: Reality Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Check declared public endpoints
        shell: bash
        env:
          PUBLIC_URLS: ${{ vars.PUBLIC_URLS }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_URLS:-}" ]; then
            echo "PUBLIC_URLS repository variable is not configured; no live claim is made."
            exit 0
          fi
          failures=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -L -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
            echo "$url -> $code"
            case "$code" in
              2*|3*) ;;
              *) failures=$((failures + 1)) ;;
            esac
          done <<< "$PUBLIC_URLS"
          if [ "$failures" -gt 0 ]; then
            echo "$failures endpoint(s) failed the heartbeat."
            exit 1
          fi
