name: Compliance Gate

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default. Jobs must opt into any additional capability.
permissions:
  contents: read

jobs:
  compliance:
    name: Security and repository compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          forbidden='(^|/)(\.env($|\.)|id_rsa|id_ed25519|.*\.(pem|key|p12|pfx))$'
          if git ls-files | grep -E "$forbidden"; then
            echo "Forbidden credential/environment files are tracked."
            exit 1
          fi

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
