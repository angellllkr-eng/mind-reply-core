name: NOVA CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: nova-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: Reject committed environment files
        shell: bash
        run: |
          if find . -maxdepth 3 -type f \( -name '.env' -o -name '.env.*' \) -not -name '.env.example' | grep -q .; then
            echo "Committed environment file detected."
            exit 1
          fi
