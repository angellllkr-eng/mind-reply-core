version: 2
# Advanced maintenance: group updates, monthly cadence, keep security responsive.
# See docs/COMPETITIVE_STRUCTURE.md
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-deps:
        dependency-type: production
        patterns: ["*"]
      development-deps:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/a11k
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    groups:
      a11k-deps:
        patterns: ["*"]
