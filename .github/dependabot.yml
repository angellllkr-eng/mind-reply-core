version: 2
# Advanced maintenance: grouped updates, monthly cadence (security still prioritized by Dependabot).
# Competitive ops: docs/COMPETITIVE_STRUCTURE.md
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    groups:
      production-deps:
        dependency-type: production
        patterns: ["*"]
      development-deps:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /apps/web-replycontrol
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /services/rwa-bridge
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, docker]

  - package-ecosystem: npm
    directory: /apps/a11k
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies]
    groups:
      a11k-deps:
        patterns: ["*"]
