name: CI
on: [push,pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: phone-first-saas-starter } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm, cache-dependency-path: phone-first-saas-starter/pnpm-lock.yaml }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Optional when Clerk/Stripe test credentials are available:
      # - run: pnpm test:e2e
