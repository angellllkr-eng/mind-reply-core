<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A11 Studio — positioning, proof boundary, and export canvas."><title>A11 Studio · Make the system legible</title><style>:root{--a:#43d6a2;--line:#ffffff18;--muted:#9aa6b7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#0c4936,#05070b 35%);color:#f8fafc;font:15px/1.6 Inter,system-ui}a{color:inherit;text-decoration:none}.s{width:min(100% - 36px,1180px);margin:auto}nav{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.1em}.brand i,.ey{color:var(--a);font-style:normal}.hero{padding:90px 0 42px}.ey{font:700 10px ui-monospace,monospace;letter-spacing:.16em}h1{font-size:clamp(58px,8vw,105px);line-height:.9;letter-spacing:-.07em;margin:22px 0}p{color:var(--muted);font-size:17px;max-width:720px}.work{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px;margin-bottom:80px}.panel{padding:24px;border:1px solid var(--line);border-radius:14px;background:#0a0f17cc;box-shadow:0 25px 80px #0006}label{display:block;color:#8592a3;font:700 10px ui-monospace,monospace;margin:12px 0 6px}input,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;background:#05080d;color:#fff;font:inherit}textarea{min-height:120px}.btn{padding:12px 18px;border:0;border-radius:9px;background:var(--a);color:#031b13;font-weight:850;margin:14px 7px 0 0;cursor:pointer}.btn.alt{background:#ffffff0a;color:#fff;border:1px solid var(--line)}.preview{min-height:470px;padding:30px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(145deg,#ffffff08,#05080d);white-space:pre-wrap;font-size:18px;line-height:1.75}@media(max-width:800px){.work{grid-template-columns:1fr}}</style></head><body><nav class="s"><a class="brand" href="https://a11-k.space">A11<i>-K</i> / STUDIO</a><span>NARRATIVE SYSTEM</span></nav><main class="s"><section class="hero"><span class="ey">POSITIONING + PROOF + INTERFACE</span><h1>Make the system legible.</h1><p>Compose positioning, verified proof, explicit boundaries and one launch action without blurring evidence and aspiration.</p></section><section class="work"><div class="panel"><label>POSITIONING</label><input id="positioning" placeholder="What is this, for whom, and why now?"><label>VERIFIED PROOF</label><textarea id="proof"></textarea><label>EXPLICIT BOUNDARY</label><textarea id="boundary"></textarea><label>ONE ACTION</label><input id="cta"><button class="btn" id="render">Render narrative</button><button class="btn alt" id="copy">Copy Markdown</button><button class="btn alt" id="html">Export HTML</button></div><div class="panel"><div class="preview" id="out">Nothing rendered.</div></div></section></main><script>let current='';render.onclick=()=>{if(!positioning.value.trim())return out.textContent='Add positioning first.';current=`# ${positioning.value}\n\n## Verified proof\n${proof.value||'Not supplied.'}\n\n## Explicit boundary\n${boundary.value||'Not supplied.'}\n\n## Recommended action\n${cta.value||'Define one action.'}`;out.textContent=current;localStorage.a11studio=current};copy.onclick=()=>navigator.clipboard.writeText(current||localStorage.a11studio||'');html.onclick=()=>{let t=(current||localStorage.a11studio||'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x])),b=new Blob([`<!doctype html><meta charset="utf-8"><main style="max-width:760px;margin:60px auto;font:18px/1.7 system-ui;white-space:pre-wrap">${t}</main>`],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='a11-studio-export.html';a.click();URL.revokeObjectURL(a.href)}</script></body></html>
