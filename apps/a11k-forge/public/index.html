<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A11 Forge — release manifest and verification-gate builder."><title>A11 Forge · Build for release</title><style>:root{--a:#ffb44a;--line:#ffffff18;--muted:#9aa6b7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#4d310b,#05070b 35%);color:#f8fafc;font:15px/1.6 Inter,system-ui}a{color:inherit;text-decoration:none}.s{width:min(100% - 36px,1180px);margin:auto}nav{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.1em}.brand i,.ey{color:var(--a);font-style:normal}.hero{padding:90px 0 42px}.ey{font:700 10px ui-monospace,monospace;letter-spacing:.16em}h1{font-size:clamp(58px,8vw,105px);line-height:.9;letter-spacing:-.07em;margin:22px 0}p{color:var(--muted);font-size:17px;max-width:720px}.work{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px;margin-bottom:80px}.panel{padding:24px;border:1px solid var(--line);border-radius:14px;background:#0a0f17cc;box-shadow:0 25px 80px #0006}label{display:block;color:#8592a3;font:700 10px ui-monospace,monospace;margin:12px 0 6px}input,textarea,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;background:#05080d;color:#fff;font:inherit}textarea{min-height:130px}.btn{padding:12px 18px;border:0;border-radius:9px;background:var(--a);color:#1d1203;font-weight:850;margin:14px 7px 0 0;cursor:pointer}.btn.alt{background:#ffffff0a;color:#fff;border:1px solid var(--line)}pre{min-height:480px;padding:18px;border:1px solid var(--line);border-radius:10px;background:#05080d;color:#d9d1c4;white-space:pre-wrap}@media(max-width:800px){.work{grid-template-columns:1fr}}</style></head><body><nav class="s"><a class="brand" href="https://a11-k.space">A11<i>-K</i> / FORGE</a><span>RELEASE SYSTEM</span></nav><main class="s"><section class="hero"><span class="ey">BUILD + VERIFY + RELEASE</span><h1>Turn intent into a releasable system.</h1><p>Generate a release manifest with acceptance tests, evidence, security, ownership, observability and rollback gates.</p></section><section class="work"><div class="panel"><label>PRODUCT / REPOSITORY</label><input id="product"><label>RELEASE TYPE</label><select id="type"><option>Web platform</option><option>API or service</option><option>Automation workflow</option><option>AI agent system</option></select><label>OUTCOME</label><textarea id="outcome"></textarea><label>CONSTRAINTS</label><input id="constraints"><button class="btn" id="build">Forge manifest</button><button class="btn alt" id="copy">Copy Markdown</button><button class="btn alt" id="json">Export JSON</button></div><div class="panel"><pre id="out">No manifest forged.</pre></div></section></main><script>let current='';build.onclick=()=>{if(!product.value.trim()||!outcome.value.trim())return out.textContent='Add product and outcome.';current=`# ${product.value} — Release Manifest\n\n**Type:** ${type.value}\n**Outcome:** ${outcome.value}\n**Constraints:** ${constraints.value||'None stated'}\n\n## Sequence\n1. Reality-check current state\n2. Define acceptance tests\n3. Implement smallest reversible slice\n4. Run evidence, security and ownership gates\n5. Verify rollback and observability\n6. Obtain human release approval\n\n## Stop conditions\n- Evidence contradicts expected value\n- Authority or ownership is unclear\n- Security boundary cannot be verified\n- Rollback is unavailable`;out.textContent=current;localStorage.a11forge=current};copy.onclick=()=>navigator.clipboard.writeText(current||localStorage.a11forge||'');json.onclick=()=>{let b=new Blob([JSON.stringify({manifest:current||localStorage.a11forge||'',exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='a11-forge-manifest.json';a.click();URL.revokeObjectURL(a.href)}</script></body></html>
