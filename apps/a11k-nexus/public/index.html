<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A11 Nexus — transparent specialist topology and decision routing."><title>A11 Nexus · See the decision system</title><style>:root{--a:#9f86ff;--bg:#05070b;--line:#ffffff18;--muted:#9aa6b7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#281d55,#05070b 35%);color:#f8fafc;font:15px/1.6 Inter,system-ui}a{color:inherit;text-decoration:none}.s{width:min(100% - 36px,1180px);margin:auto}nav{height:74px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.1em}.brand i,.ey{color:var(--a);font-style:normal}.hero{padding:90px 0 42px}.ey{font:700 10px ui-monospace,monospace;letter-spacing:.16em}h1{font-size:clamp(58px,8vw,105px);line-height:.9;letter-spacing:-.07em;margin:22px 0}p{color:var(--muted);font-size:17px;max-width:720px}.work{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:80px}.panel{padding:24px;border:1px solid var(--line);border-radius:14px;background:#0a0f17cc;box-shadow:0 25px 80px #0006}.top{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.m{padding:16px;border:1px solid var(--line);border-radius:9px}.m b{font-size:28px}.m small{display:block;color:#7e8a9b}label{display:block;color:#8592a3;font:700 10px ui-monospace,monospace;margin:14px 0 6px}textarea,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:9px;background:#05080d;color:#fff;font:inherit}textarea{min-height:130px}.btn{padding:12px 18px;border:0;border-radius:9px;background:var(--a);color:#0a0717;font-weight:850;margin:14px 0;cursor:pointer}pre{min-height:250px;padding:18px;border:1px solid var(--line);border-radius:10px;background:#05080d;color:#d3d6e5;white-space:pre-wrap}.nodes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.node{padding:11px;border:1px solid #9f86ff42;border-radius:8px;text-align:center;font:700 9px ui-monospace,monospace}@media(max-width:800px){.work{grid-template-columns:1fr}.nodes{grid-template-columns:repeat(2,1fr)}}</style></head><body><nav class="s"><a class="brand" href="https://a11-k.space">A11<i>-K</i> / NEXUS</a><span>TRANSPARENT ROUTING</span></nav><main class="s"><section class="hero"><span class="ey">TOPOLOGY + DECISION ROUTING</span><h1>See the decision system.</h1><p>Compose a scenario, choose the primary lens and generate a transparent specialist route with explicit verification gates.</p></section><section class="work"><div class="panel"><div class="top"><div class="m"><b>20</b><small>CELLS</small></div><div class="m"><b>5</b><small>GATES</small></div><div class="m"><b>1</b><small>DECISION</small></div></div><div class="nodes" id="nodes"></div></div><div class="panel"><label>SCENARIO</label><textarea id="scenario" placeholder="Decision, constraint or opportunity"></textarea><label>PRIMARY LENS</label><select id="lens"><option>Profit and distribution</option><option>Engineering and release</option><option>Ownership and legal</option><option>Security and fraud</option><option>Funding and partnerships</option></select><button class="btn" id="route">Compose route</button><pre id="out">No route composed.</pre></div></section></main><script>const cells=['GitHub Advanced','Revenue Signal','Distribution','AI Automation','Security','Legal + Compliance','Financial Risk','IP + Trademark','Grants + Funding','Partnerships','Global Arbitrage','Synthesis + Red Team'];nodes.innerHTML=cells.map(x=>`<div class="node">${x}</div>`).join('');route.onclick=()=>{let s=scenario.value.trim(),l=lens.value;if(!s)return out.textContent='Add a scenario first.';let c=l.includes('Profit')?['Revenue Signal','Distribution','Financial Risk','Red Team']:l.includes('Engineering')?['GitHub Advanced','AI Automation','Security','Red Team']:l.includes('Ownership')?['IP + Trademark','Legal + Compliance','Financial Risk','Red Team']:l.includes('Security')?['Security','Legal + Compliance','Financial Risk','Red Team']:['Grants + Funding','Partnerships','Legal + Compliance','Red Team'];out.textContent=`ROUTING PLAN\n${l}\n\n${c.map((x,i)=>`${i+1}. ${x}`).join('\n')}\n\nGATES\n- Verify external facts\n- Mark assumptions and access limits\n- Red-team ownership and downside\n- Return one reversible recommendation`;let a=JSON.parse(localStorage.a11nexus||'[]');a.unshift({at:new Date().toISOString(),s,l});localStorage.a11nexus=JSON.stringify(a.slice(0,30))}</script></body></html>
